# AWX 17.1.0 - hand-rendered from the 17.1.0 installer templates (the installer
# itself won't run on this VM: ansible-core 2.20 removed community.docker's
# docker_compose module). Brought up with the modern `docker compose` plugin.
# Values match awx/inventory. Admin user is created on first web boot from the
# AWX_ADMIN_* vars in environment.sh (migrations run ~3-5 min on first start).
version: '2'
services:
  web:
    image: ansible/awx:17.1.0
    container_name: awx_web
    depends_on: [redis, postgres]
    ports:
      - "8052:8052"
    hostname: awxweb
    user: root
    restart: unless-stopped
    volumes:
      - supervisor-socket:/var/run/supervisor
      - rsyslog-socket:/var/run/awx-rsyslog/
      - rsyslog-config:/var/lib/awx/rsyslog/
      - "/var/lib/awx/awxcompose/SECRET_KEY:/etc/tower/SECRET_KEY"
      - "/var/lib/awx/awxcompose/environment.sh:/etc/tower/conf.d/environment.sh"
      - "/var/lib/awx/awxcompose/credentials.py:/etc/tower/conf.d/credentials.py"
      - "/var/lib/awx/awxcompose/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "/var/lib/awx/awxcompose/redis_socket:/var/run/redis/:rw"
      - "/var/lib/awx/projects:/var/lib/awx/projects:rw"
    environment:
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
  task:
    image: ansible/awx:17.1.0
    container_name: awx_task
    depends_on: [redis, web, postgres]
    command: /usr/bin/launch_awx_task.sh
    hostname: awx
    user: root
    restart: unless-stopped
    volumes:
      - supervisor-socket:/var/run/supervisor
      - rsyslog-socket:/var/run/awx-rsyslog/
      - rsyslog-config:/var/lib/awx/rsyslog/
      - "/var/lib/awx/awxcompose/SECRET_KEY:/etc/tower/SECRET_KEY"
      - "/var/lib/awx/awxcompose/environment.sh:/etc/tower/conf.d/environment.sh"
      - "/var/lib/awx/awxcompose/credentials.py:/etc/tower/conf.d/credentials.py"
      - "/var/lib/awx/awxcompose/redis_socket:/var/run/redis/:rw"
      - "/var/lib/awx/projects:/var/lib/awx/projects:rw"
    environment:
      AWX_SKIP_MIGRATIONS: "1"
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
      SUPERVISOR_WEB_CONFIG_PATH: '/etc/supervisord.conf'
  redis:
    image: redis:7
    container_name: awx_redis
    restart: unless-stopped
    command: ["/usr/local/etc/redis/redis.conf"]
    volumes:
      - "/var/lib/awx/awxcompose/redis.conf:/usr/local/etc/redis/redis.conf:ro"
      - "/var/lib/awx/awxcompose/redis_socket:/var/run/redis/:rw"
  postgres:
    image: postgres:12
    container_name: awx_postgres
    restart: unless-stopped
    volumes:
      - "/var/lib/awx/pgdocker/12/data/:/var/lib/postgresql/data:Z"
    environment:
      POSTGRES_USER: awx
      POSTGRES_PASSWORD: awxpass
      POSTGRES_DB: awx
volumes:
  supervisor-socket:
  rsyslog-socket:
  rsyslog-config:
