---
# Self-healing remediation (Docker edition).
# Launched by AWX from a Dynatrace problem notification (which passes `state`,
# `pid`, ... as extra vars). On an OPEN problem it triggers the rollback webhook,
# which redeploys prod carts from the good spec (no CPU throttle). The Dynatrace
# comment calls are best-effort (need a problems-write token) and never block the
# actual rollback.
- name: autoremediation - roll back prod carts to the good build
  hosts: localhost
  gather_facts: false
  vars:
    state: "OPEN"
  tasks:
    - name: comment to Dynatrace - remediation started
      uri:
        url: "{{ dtcommentapiurl }}"
        method: POST
        body_format: json
        body:
          comment: "Self-healing: rolling back prod carts to the good build."
          user: "{{ commentuser }}"
          context: "Ansible Tower"
        status_code: [200, 201]
        validate_certs: no
      when: state == "OPEN"
      ignore_errors: yes

    - name: trigger rollback webhook (redeploy good prod carts)
      uri:
        url: "{{ rollback_webhook_url }}"
        method: GET
        status_code: [200]
        validate_certs: no
      when: state == "OPEN"
      register: rollback

    - name: comment to Dynatrace - remediation complete
      uri:
        url: "{{ dtcommentapiurl }}"
        method: POST
        body_format: json
        body:
          comment: "Self-healing complete: prod carts redeployed (good build)."
          user: "{{ commentuser }}"
          context: "Ansible Tower"
        status_code: [200, 201]
        validate_certs: no
      when: state == "OPEN" and rollback.status is defined and rollback.status == 200
      ignore_errors: yes
