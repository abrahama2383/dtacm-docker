# nginx "Service layer" for one SockShop stage.
# Static upstreams + keepalive, routed by Host header via per-service server
# blocks. (The earlier `resolver + map + variable proxy_pass` re-resolved every
# request and intermittently reset the connection - which crashed the fragile
# Node front-end on JSON.parse of an empty body. Static upstreams keep stable,
# pooled connections.)
#
# Trade-off: upstream IPs resolve at nginx start. After a backend CONTAINER is
# recreated (new IP), restart the gateway too - `docker compose up` / `make up`
# recreates the gateway (it depends_on the services), so the normal flow is fine.

upstream up_front_end    { server front-end-internal:8080;    keepalive 16; }
upstream up_catalogue    { server catalogue-internal:8080;    keepalive 16; }
upstream up_carts        { server carts-internal:8080;        keepalive 16; }
upstream up_orders       { server orders-internal:8080;       keepalive 16; }
upstream up_user         { server user-internal:8080;         keepalive 16; }
upstream up_payment      { server payment-internal:8080;      keepalive 16; }
upstream up_shipping     { server shipping-internal:8080;     keepalive 16; }
upstream up_queue        { server queue-master-internal:8080; keepalive 16; }

# shared proxy settings
proxy_connect_timeout 5s;
proxy_read_timeout    120s;
proxy_send_timeout    120s;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

server { listen 80 default_server; server_name front-end _; location / { proxy_pass http://up_front_end; } }
server { listen 80; server_name catalogue;    location / { proxy_pass http://up_catalogue; } }
server { listen 80; server_name carts;        location / { proxy_pass http://up_carts; } }
server { listen 80; server_name orders;       location / { proxy_pass http://up_orders; } }
server { listen 80; server_name user;         location / { proxy_pass http://up_user; } }
server { listen 80; server_name payment;      location / { proxy_pass http://up_payment; } }
server { listen 80; server_name shipping;     location / { proxy_pass http://up_shipping; } }
server { listen 80; server_name queue-master; location / { proxy_pass http://up_queue; } }
