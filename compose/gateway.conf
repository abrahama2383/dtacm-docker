# nginx "Service layer" for one SockShop stage.
# Static upstreams routed by Host header via per-service server blocks, with NO
# connection pooling on either side (fresh connection per request). Rationale:
#   * the old `resolver + variable proxy_pass` re-resolved every request and
#     intermittently reset the connection;
#   * upstream `keepalive` pooled nginx->backend connections that the flaky old
#     backends (Go catalogue, Java carts) close when idle, so nginx reused dead
#     sockets -> 502 / reset.
# The fragile Node front-end does JSON.parse() on the response and CRASHES on an
# empty/HTML body, so the gateway must never hand it a reset or a 502. Fresh
# connections + proxy_next_upstream retry make it reliable.
#
# Trade-off: upstream IPs resolve at nginx start; after a backend container is
# recreated, restart the gateway (`docker compose up` / `make up` does this).

upstream up_front_end    { server front-end-internal:8080; }
upstream up_catalogue    { server catalogue-internal:8080; }
upstream up_carts        { server carts-internal:8080; }
upstream up_orders       { server orders-internal:8080; }
upstream up_user         { server user-internal:8080; }
upstream up_payment      { server payment-internal:8080; }
upstream up_shipping     { server shipping-internal:8080; }
upstream up_queue        { server queue-master-internal:8080; }

# shared proxy settings (http context, inherited)
proxy_connect_timeout 5s;
proxy_read_timeout    120s;
proxy_send_timeout    120s;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# retry once on a dead/hiccuping backend instead of returning an error the
# front-end would crash on
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;

server { listen 80 default_server; server_name front-end _; location / { proxy_pass http://up_front_end; } }
server { listen 80; server_name catalogue;    location / { proxy_pass http://up_catalogue; } }
server { listen 80; server_name carts;        location / { proxy_pass http://up_carts; } }
server { listen 80; server_name orders;       location / { proxy_pass http://up_orders; } }
server { listen 80; server_name user;         location / { proxy_pass http://up_user; } }
server { listen 80; server_name payment;      location / { proxy_pass http://up_payment; } }
server { listen 80; server_name shipping;     location / { proxy_pass http://up_shipping; } }
server { listen 80; server_name queue-master; location / { proxy_pass http://up_queue; } }
