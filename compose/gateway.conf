# nginx "Service layer" for one SockShop stage.
# Routes the hostname the app dialed (Host header) to the real container:8080.
# Uses Docker's embedded DNS (127.0.0.11) so upstreams resolve at request time.

resolver 127.0.0.11 valid=10s ipv6=off;

map $host $sockshop_backend {
    default        front-end-internal:8080;
    front-end      front-end-internal:8080;
    catalogue      catalogue-internal:8080;
    carts          carts-internal:8080;
    orders         orders-internal:8080;
    user           user-internal:8080;
    payment        payment-internal:8080;
    shipping       shipping-internal:8080;
    queue-master   queue-master-internal:8080;
}

server {
    listen 80;
    server_name _;

    # generous timeouts: the Java services are slow to warm up
    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    location / {
        set $backend $sockshop_backend;
        proxy_pass http://$backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
