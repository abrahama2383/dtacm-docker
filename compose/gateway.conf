# nginx "Service layer" for one SockShop stage.
# Routes the bare Host the app dialed (carts, catalogue, ...) to the real
# container <name>-internal:8080, re-resolving via Docker's embedded DNS
# (127.0.0.11) on every request so it survives backend container recreates
# (new IPs) without needing a gateway restart.
#
# NOTE: this only works because the app services are keyed "<name>-internal"
# (see docker-compose.sockshop.yml) - so the bare name here belongs ONLY to this
# gateway. If an app also registered the bare name, requests would round-robin
# to the app on port 80 (it listens on 8080) and be refused.

resolver 127.0.0.11 valid=10s ipv6=off;

map $host $sockshop_backend {
    default        front-end-internal:8080;
    front-end      front-end-internal:8080;
    catalogue      catalogue-internal:8080;
    carts          carts-internal:8080;
    orders         orders-internal:8080;
    user           user-internal:80;

    payment        payment-internal:8080;
    shipping       shipping-internal:8080;
    queue-master   queue-master-internal:8080;
}

server {
    listen 80;
    server_name _;

    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    location / {
        set $backend $sockshop_backend;
        proxy_pass http://$backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
