# =============================================================================
# SockShop - single-stage stack (Docker Compose translation of the k8s manifests)
# -----------------------------------------------------------------------------
# Launched TWICE (dev + prod) with different project names + env files:
#   docker compose -p sockshop-dev  --env-file dev.env  -f docker-compose.sockshop.yml up -d
#   docker compose -p sockshop-prod --env-file prod.env -f docker-compose.sockshop.yml up -d
#
# The nginx "gateway" is the Compose equivalent of the k8s Service layer: it owns
# every bare HTTP name (carts, catalogue, ...) as a network alias and proxies
# :80 -> <name>-internal:8080. The app containers are therefore named
# "<name>-internal" (their service key) so the BARE name resolves ONLY to the
# gateway. (If an app service were keyed "carts", Docker would also register
# "carts" for the real container, and callers hitting carts:80 would randomly
# land on the app - which listens on 8080, not 80 - and get connection-refused.)
# Databases keep their real names (carts-db, ...) and are hit directly on their
# native ports, so they need no gateway.
# =============================================================================

networks:
  sockshop:
    name: ${COMPOSE_PROJECT_NAME:-sockshop}_net

volumes:
  carts-db-data:
  orders-db-data:
  user-db-data:

services:

  # ---- Gateway = the "Service" layer (owns the bare names) -------------------
  gateway:
    image: nginx:1.25-alpine
    restart: unless-stopped
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-8079}:80"     # browse the SockShop UI here
    networks:
      sockshop:
        aliases: [front-end, catalogue, carts, orders, user, payment, shipping, queue-master]
    depends_on:
      - front-end-internal
      - catalogue-internal
      - carts-internal
      - orders-internal
      - user-internal
      - payment-internal

  # ---- Front-end (UI) --------------------------------------------------------
  front-end-internal:
    image: dynatracesockshop/front-end:0.5.0
    restart: unless-stopped
    networks: [sockshop]
    labels: { app: "front-end", tier: "frontend", product: "sockshop", stage: "${STAGE}" }

  # ---- Business services -----------------------------------------------------
  catalogue-internal:
    image: dynatracesockshop/catalogue:0.5.0
    restart: unless-stopped
    networks: [sockshop]
    depends_on:
      catalogue-db: { condition: service_healthy }
    labels: { app: "catalogue", tier: "business", product: "sockshop", stage: "${STAGE}" }

  carts-internal:
    # Locally-built glibc carts (carts-glibc/Dockerfile) so OneAgent injects and
    # carts is monitored. good build -> this image; bad build -> carts-badbuild.override.yml.
    image: ${CARTS_IMAGE:-dtacm/carts:1.0}
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms128m -Xmx512m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom"
      # OneAgent reads DT_TAGS -> [Environment] tags on the carts process/service,
      # which the Jenkins deployment-event / quality-gate tagMatchRules match.
      DT_TAGS: "app=carts stage=${STAGE}"
    networks: [sockshop]
    depends_on:
      carts-db: { condition: service_healthy }
    labels: { app: "carts", tier: "business", version: "${CARTS_VERSION:-2.3}", product: "sockshop", stage: "${STAGE}" }

  orders-internal:
    image: dynatracesockshop/orders:0.5.0
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms128m -Xmx512m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom"
    networks: [sockshop]
    depends_on:
      orders-db: { condition: service_healthy }
    labels: { app: "orders", tier: "business", product: "sockshop", stage: "${STAGE}" }

  user-internal:
    # weaveworksdemos/user (reference impl) instead of dynatracesockshop/user:0.5.0:
    # the dynatrace fork returns empty HATEOAS _links (no href), so the front-end
    # can't assemble an order and checkout 500s. This image populates _links.
    # NOTE: it listens on port 80 (not 8080) - the gateway maps user -> :80.
    image: weaveworksdemos/user:0.4.7
    restart: unless-stopped
    networks: [sockshop]
    depends_on:
      user-db: { condition: service_healthy }
    labels: { app: "user", tier: "business", product: "sockshop", stage: "${STAGE}" }

  payment-internal:
    image: dynatracesockshop/payment:0.5.0
    restart: unless-stopped
    networks: [sockshop]
    labels: { app: "payment", tier: "business", product: "sockshop", stage: "${STAGE}" }

  shipping-internal:
    image: dynatracesockshop/shipping:0.5.0
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms128m -Xmx512m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom"
    networks: [sockshop]
    depends_on:
      rabbitmq: { condition: service_healthy }
    labels: { app: "shipping", tier: "business", product: "sockshop", stage: "${STAGE}" }

  queue-master-internal:
    image: dynatracesockshop/queue-master:0.5.0
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms128m -Xmx512m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom"
    networks: [sockshop]
    depends_on:
      rabbitmq: { condition: service_healthy }
    labels: { app: "queue-master", tier: "messaging", product: "sockshop", stage: "${STAGE}" }

  # ---- Data stores (real names, native ports, no gateway) --------------------
  carts-db:
    image: mongo:4.4
    restart: unless-stopped
    volumes: [ "carts-db-data:/data/db" ]
    networks: [sockshop]
    healthcheck:
      test: ["CMD","mongo","--quiet","--eval","db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels: { app: "carts-db", tier: "data", product: "sockshop", stage: "${STAGE}" }

  orders-db:
    image: mongo:4.4
    restart: unless-stopped
    volumes: [ "orders-db-data:/data/db" ]
    networks: [sockshop]
    healthcheck:
      test: ["CMD","mongo","--quiet","--eval","db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels: { app: "orders-db", tier: "data", product: "sockshop", stage: "${STAGE}" }

  user-db:
    image: mongo:4.4
    restart: unless-stopped
    volumes: [ "user-db-data:/data/db" ]
    networks: [sockshop]
    healthcheck:
      test: ["CMD","mongo","--quiet","--eval","db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels: { app: "user-db", tier: "data", product: "sockshop", stage: "${STAGE}" }

  catalogue-db:
    image: dynatracesockshop/catalogue-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fake_password
      MYSQL_DATABASE: socksdb
    networks: [sockshop]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-pfake_password"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    labels: { app: "catalogue-db", tier: "data", product: "sockshop", stage: "${STAGE}" }

  rabbitmq:
    image: rabbitmq:3.6.8-management
    restart: unless-stopped
    networks: [sockshop]
    healthcheck:
      test: ["CMD","rabbitmqctl","status"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    labels: { app: "rabbitmq", tier: "messaging", product: "sockshop", stage: "${STAGE}" }
